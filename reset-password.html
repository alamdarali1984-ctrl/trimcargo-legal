<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://ynqkncctbipvyhfvoqgp.supabase.co; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" />
<title>TrimCargo &mdash; Reset Password</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1a1a1a; max-width: 560px; margin: 32px auto; padding: 0 20px 80px; line-height: 1.6; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; border: 1px solid #888; border-radius: 6px; }
  button { margin-top: 16px; padding: 11px 18px; font: inherit; font-weight: 700; border: 0; border-radius: 6px; color: white; background: #0878c9; cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: default; }
  .message { margin-top: 18px; padding: 12px; border-radius: 6px; background: #f1f3f5; }
</style>
</head>
<body>
<h1>Reset your TrimCargo Cloud password</h1>
<p>Use at least 12 characters with an upper-case letter, lower-case letter, number and symbol.</p>
<form id="reset-form">
  <label for="password">New password</label>
  <input id="password" type="password" autocomplete="new-password" required />
  <label for="confirm-password">Confirm new password</label>
  <input id="confirm-password" type="password" autocomplete="new-password" required />
  <button id="submit" type="submit">Update password</button>
</form>
<p id="message" class="message" role="status">Checking the secure recovery link&hellip;</p>
<p><a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></p>

<script>
(() => {
  "use strict";
  const projectUrl = "https://ynqkncctbipvyhfvoqgp.supabase.co";
  const publishableKey = "sb_publishable_8xWvqoA9G2pJyucaY-ObYw_mGI6L6Vz";
  const form = document.getElementById("reset-form");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");
  const hash = new URLSearchParams(window.location.hash.slice(1));
  let accessToken = hash.get("access_token");
  const recoveryType = hash.get("type");
  const linkError = hash.get("error_description");
  history.replaceState(null, document.title, window.location.pathname);

  const show = (text, error = false) => {
    message.textContent = text;
    message.style.background = error ? "#fff4f4" : "#ebfbee";
  };
  if (linkError) {
    submit.disabled = true;
    show(linkError, true);
  } else if (!accessToken || recoveryType !== "recovery") {
    submit.disabled = true;
    show("This recovery link is missing, invalid or expired. Request a new link from Account & Cloud.", true);
  } else {
    show("Recovery link accepted. Choose a new password.");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!accessToken) return;
    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("confirm-password").value;
    const strong = password.length >= 12 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
    if (!strong) return show("Use at least 12 characters with upper-case, lower-case, number and symbol.", true);
    if (password !== confirmation) return show("The two passwords do not match.", true);
    submit.disabled = true;
    show("Updating your password...");
    try {
      const response = await fetch(projectUrl + "/auth/v1/user", {
        method: "PUT",
        headers: {
          "apikey": publishableKey,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ password }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.msg || payload.message || "Password update failed.");
      accessToken = null;
      form.reset();
      show("Password updated. Return to TrimCargo and sign in with the new password.");
    } catch (error) {
      submit.disabled = false;
      show(error instanceof Error ? error.message : "Password update failed.", true);
    }
  });
})();
</script>
</body>
</html>
